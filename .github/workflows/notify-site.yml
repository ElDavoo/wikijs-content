# Tell the site generator that content changed, so it rebuilds and publishes a
# new image.
#
# Uses the REST API directly rather than a marketplace action: this repository
# holds the site's content, and a third-party action running here would be able
# to read it.
#
# Needs a repository secret SITE_DISPATCH_TOKEN — a fine-grained PAT scoped to
# ElDavoo/davidepalma-site with "Contents: read" and "Metadata: read".
name: notify site build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the site build
        run: |
          curl -sS --fail-with-body -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.SITE_DISPATCH_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/ElDavoo/davidepalma-site/dispatches \
            -d '{"event_type":"content-updated"}'
