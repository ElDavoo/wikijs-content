# Tell the site generator that content changed, so it rebuilds and publishes a
# new image.
#
# Uses the REST API directly rather than a marketplace action: this repository
# holds the site's content, and a third-party action running here would be able
# to read it. (Actions are restricted to local_only here for the same reason.)
#
# Needs a repository secret SITE_DISPATCH_TOKEN — a fine-grained PAT scoped to
# ElDavoo/davidepalma-site with "Contents: Read and write", which is what the
# repository_dispatch API requires.
#
# If this is broken the site is not stuck, only slow: the generator also rebuilds
# on a daily schedule, and `gh workflow run build.yml -R ElDavoo/davidepalma-site`
# triggers one on demand.
name: notify site build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the site build
        env:
          TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::SITE_DISPATCH_TOKEN is not set on this repository."
            exit 1
          fi

          code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/ElDavoo/davidepalma-site/dispatches \
            -d '{"event_type":"content-updated"}')

          case "$code" in
            204) echo "site build triggered"; exit 0 ;;
            401) echo "::error::SITE_DISPATCH_TOKEN was rejected (401 Bad credentials). The stored value is not a valid token — re-copy it and run: gh secret set SITE_DISPATCH_TOKEN --repo ElDavoo/${{ github.event.repository.name }}" ;;
            403) echo "::error::SITE_DISPATCH_TOKEN lacks permission (403). It needs 'Contents: Read and write' on ElDavoo/davidepalma-site." ;;
            404) echo "::error::ElDavoo/davidepalma-site not found (404). The token is probably not scoped to that repository." ;;
            *)   echo "::error::Unexpected HTTP $code from the dispatch API." ;;
          esac
          # The response body cannot contain the token, only GitHub's message.
          cat /tmp/resp.json
          exit 1
